<form action="" method="post" style="margin-bottom: 0px;display:inline-block">
<div class="edit_tag_container">
  <input type="text" id="edittags" name="edittags" oninput="document.getElementById('tags_save').style['display'] = 'block';" value="[[ tags ]]">
  <input id="tags_save" type="submit" style="display:block" value="[[ submit ]]">
  <script>document.getElementById('tags_save').style['display'] = 'none';</script>
</div>
</form>
